[project]
name = "h3-sglang"
version = "0.1.0"
description = "Gradio frontend for native SGLang MiniMax H3 deployment"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "gradio>=5,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "starlette>=0.40,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
